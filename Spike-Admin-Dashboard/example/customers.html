<!doctype html>
<!--
  Spike Admin Dashboard — Customers (example page)

  Customers table: search, status filter, sortable columns, row selection, page size and pagination.

  Part of a set of example pages that share one shell. Read the conventions:
  - shared.js holds the theme tokens (light from design.md, dark PROPOSED),
    tailwind.config, the light/dark toggle, the mobile drawer and the cart.
  - Use token class names only (bg-surface, text-muted, border-line, bg-primary…),
    never stock Tailwind colors, so the page follows light/dark automatically.
  - Components from element/*.md are marked `Component: <Name> · element/<file>.md`
    and `data-component="<Name>"`. Pieces with no spec file are marked
    `Component: <Name> (no spec)`.
  - All names, products and numbers are sample data. No external images.
  - [data-profile="<field>"] elements show the current user (see shared.js).
    Text inside them is only the default before the script runs.
  - Styling: Tailwind CSS via the Play CDN — needs internet to load styles.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spike Admin — Customers</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="shared.js"></script>
</head>

        <button type="button" data-theme-toggle aria-label="Switch theme"

      <!-- Component: CustomersTable (no spec) — DataTable · element/design-table.md
           with search, status filter, sortable columns, row selection,
           page size and pagination. All filtering happens on the `customers` array. -->
      <section data-component="CustomersTable" aria-labelledby="customers-title" class="rounded-card border border-line bg-surface shadow-card">

        <header class="flex flex-wrap items-center justify-between gap-3 p-5 md:px-6">

            <h2 id="customers-title" class="text-lg font-semibold">Customers</h2>

          <div class="flex w-full flex-wrap gap-2 sm:w-auto">

            <label data-component="SearchField" class="relative block min-w-0 flex-1 sm:w-64 sm:flex-none">

              <input id="search" type="search" placeholder="Search name, email, city…" class="h-10 w-full rounded-control border border-line bg-surface pl-9 pr-3 placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30" />
            </label>
            <!-- Component: Select · element/design-select.md -->
            <label class="sr-only" for="status-filter">Status</label>
            <select id="status-filter" data-component="Select" class="h-10 rounded-control border border-line bg-surface px-3 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
              <option value="">All statuses</option>
              <option>Active</option><option>New</option><option>Inactive</option><option>Blocked</option>
            </select>
            <!-- Component: Button · element/design-button.md -->
            <button type="button" id="export" data-component="Button" class="inline-flex h-10 items-center gap-2 rounded-control border border-primary px-4 font-medium text-primary hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-primary">
              <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              <span id="export-label">Export CSV</span>
            </button>
          </div>
        </header>

        <!-- Bulk bar: visible while rows are selected -->
        <div id="bulk-bar" hidden class="flex flex-wrap items-center gap-3 border-y border-line bg-primary-light px-5 py-2.5 md:px-6">
          <span class="font-medium text-primary"><span id="selected-count" class="tabular">0</span> selected</span>
          <button type="button" id="clear-selection" class="rounded-control px-2 py-1 font-medium text-primary hover:bg-primary/10">Clear</button>
        </div>

        <div class="relative overflow-x-auto">
          <table class="min-w-full text-left">
            <thead class="bg-thead text-xs uppercase tracking-wide text-muted">
              <tr>
                <th scope="col" class="w-12 py-3 pl-5 md:pl-6">
                  <input type="checkbox" id="select-page" aria-label="Select all customers on this page" class="h-4 w-4 rounded accent-[rgb(var(--c-primary))]" />
                </th>
                <th scope="col" aria-sort="none" data-sort="name" class="px-4 py-3 font-semibold"><button type="button" class="sort-btn inline-flex items-center gap-1 uppercase hover:text-ink">Customer<span aria-hidden="true" class="sort-icon"></span></button></th>
                <th scope="col" aria-sort="none" data-sort="city" class="px-4 py-3 font-semibold"><button type="button" class="sort-btn inline-flex items-center gap-1 uppercase hover:text-ink">Location<span aria-hidden="true" class="sort-icon"></span></button></th>
                <th scope="col" aria-sort="none" data-sort="orders" class="px-4 py-3 text-right font-semibold"><button type="button" class="sort-btn inline-flex items-center gap-1 uppercase hover:text-ink">Orders<span aria-hidden="true" class="sort-icon"></span></button></th>
                <th scope="col" aria-sort="none" data-sort="spent" class="px-4 py-3 text-right font-semibold"><button type="button" class="sort-btn inline-flex items-center gap-1 uppercase hover:text-ink">Spent<span aria-hidden="true" class="sort-icon"></span></button></th>
                <th scope="col" class="px-4 py-3 font-semibold">Status</th>
                <th scope="col" aria-sort="descending" data-sort="joined" class="px-4 py-3 pr-5 font-semibold md:pr-6"><button type="button" class="sort-btn inline-flex items-center gap-1 uppercase hover:text-ink">Joined<span aria-hidden="true" class="sort-icon"></span></button></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <!-- Component: EmptyState · element/design-empty-state.md -->
        <div id="empty" hidden data-component="EmptyState" class="grid min-h-48 place-items-center border-t border-line p-6 text-center">
          <div>
            <p class="text-base font-medium">No customers found</p>
            <p class="mt-1 text-muted">Try another search or status.</p>
            <button type="button" id="clear-filters" class="mt-4 inline-flex h-10 items-center rounded-control px-4 font-medium text-primary hover:bg-primary-light">Clear filters</button>
          </div>
        </div>

        <!-- Component: Pagination (no spec) -->
        <footer data-component="Pagination" class="flex flex-wrap items-center justify-between gap-3 border-t border-line px-5 py-3 md:px-6">
          <div class="flex items-center gap-2 text-muted">
            <label for="page-size">Rows per page</label>
            <select id="page-size" class="h-9 rounded-control border border-line bg-surface px-2 text-ink focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
              <option>5</option><option selected>10</option><option>25</option><option>50</option>
            </select>
          </div>
          <p id="range" class="tabular text-muted" aria-live="polite"></p>
          <nav aria-label="Pagination">
            <ul id="pages" class="flex items-center gap-1"></ul>
          </nav>
        </footer>
      </section>
    </main>
  </div>
</div>

<script>
  // Sample data: 57 generated customers (seeded, so every load is the same).
  const customers = (() => {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const first = ['Maya', 'Leo', 'Ana', 'Tom', 'Jordan', 'Priya', 'Sam', 'Noah', 'Emma', 'Liam', 'Olivia', 'Ava', 'Ethan', 'Mia', 'Lucas', 'Zoe', 'Ivan', 'Chloe', 'Omar', 'Grace'];
    const last = ['Chen', 'Park', 'Silva', 'Reed', 'Lee', 'Nair', 'Ortiz', 'Kim', 'Brown', 'Garcia', 'Patel', 'Nguyen', 'Cohen', 'Rossi', 'Smith', 'Khan'];
    const cities = ['Seattle, WA', 'Austin, TX', 'Miami, FL', 'Denver, CO', 'Boston, MA', 'Chicago, IL', 'Portland, OR', 'New York, NY', 'Los Angeles, CA', 'Phoenix, AZ'];
    const statuses = ['Active', 'Active', 'Active', 'New', 'Inactive', 'Blocked'];
    return Array.from({ length: 57 }, (_, i) => {
      const f = pick(first), l = pick(last);
      const status = pick(statuses);
      const orders = status === 'New' ? Math.ceil(rnd() * 2) : Math.floor(rnd() * 40);
      const joined = new Date(2026, 0, 1 + Math.floor(rnd() * 280));
      return {
        id: i + 1, name: `${f} ${l}`, email: `${f}.${l}${i}@example.test`.toLowerCase(),
        city: pick(cities), orders, spent: orders * (40 + Math.floor(rnd() * 160)), status, joined,
      };
    });
  })();

  const badge = {
    Active: 'bg-success-light text-success-dark',
    New: 'bg-info-light text-info-dark',
    Inactive: 'bg-soft text-muted',
    Blocked: 'bg-danger-light text-danger-dark',
  };
  const tones = ['bg-primary-light text-primary', 'bg-secondary-light text-info-dark', 'bg-success-light text-success-dark', 'bg-warning-light text-warning-dark', 'bg-danger-light text-danger-dark'];
  const fmtDate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const money = (n) => '$' + n.toLocaleString('en-US');

  const state = { query: '', status: '', sort: 'joined', dir: -1, page: 1, size: 10, selected: new Set() };
  const $ = (id) => document.getElementById(id);

  function filtered() {
    const q = state.query;
    const list = customers.filter((c) =>
      (!state.status || c.status === state.status) &&
      (!q || `${c.name} ${c.email} ${c.city}`.toLowerCase().includes(q)));
    return list.sort((a, b) => {
      const x = a[state.sort], y = b[state.sort];
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * state.dir;
    });
  }

  // Page numbers with ellipses: 1 … 4 5 6 … 12
  function pageList(current, total) {
    const set = new Set([1, total, current - 1, current, current + 1].filter((n) => n >= 1 && n <= total));
    const out = [];
    [...set].sort((a, b) => a - b).forEach((n, i, arr) => {
      if (i && n - arr[i - 1] > 1) out.push('…');
      out.push(n);
    });
    return out;
  }

  function render() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / state.size));
    state.page = Math.min(state.page, pages);
    const start = (state.page - 1) * state.size;
    const rows = list.slice(start, start + state.size);

    $('total-count').textContent = list.length;
    $('empty').hidden = list.length > 0;
    $('rows').closest('table').classList.toggle('hidden', list.length === 0);

    $('rows').innerHTML = rows.map((c) => {
      const checked = state.selected.has(c.id);
      return `
      <tr class="border-t border-line ${checked ? 'bg-primary-light/60' : 'hover:bg-soft'}">
        <td class="py-3 pl-5 md:pl-6"><input type="checkbox" data-row="${c.id}" ${checked ? 'checked' : ''} aria-label="Select ${c.name}" class="h-4 w-4 rounded accent-[rgb(var(--c-primary))]" /></td>
        <td class="px-4 py-3">
          <!-- CustomerIdentityCell · element/design-customer-identity-cell.md -->
          <div class="flex min-w-52 items-center gap-3">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-xs font-semibold ${tones[c.id % tones.length]}" aria-hidden="true">${c.name.split(' ').map((p) => p[0]).join('')}</span>
            <div class="min-w-0"><p class="truncate font-medium">${c.name}</p><p class="truncate text-xs text-muted">${c.email}</p></div>
          </div>
        </td>
        <td class="whitespace-nowrap px-4 py-3 text-muted">${c.city}</td>
        <td class="tabular px-4 py-3 text-right">${c.orders}</td>
        <td class="tabular px-4 py-3 text-right font-medium">${money(c.spent)}</td>
        <td class="px-4 py-3"><span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${badge[c.status]}">${c.status}</span></td>
        <td class="whitespace-nowrap px-4 py-3 pr-5 text-muted md:pr-6">${fmtDate(c.joined)}</td>
      </tr>`;
    }).join('');

    // Select-all checkbox reflects the current page: checked / indeterminate / empty.
    const onPage = rows.filter((c) => state.selected.has(c.id)).length;
    $('select-page').checked = rows.length > 0 && onPage === rows.length;
    $('select-page').indeterminate = onPage > 0 && onPage < rows.length;
    $('bulk-bar').hidden = state.selected.size === 0;
    $('selected-count').textContent = state.selected.size;
    $('export-label').textContent = state.selected.size ? `Export ${state.selected.size} selected` : 'Export CSV';

    document.querySelectorAll('th[data-sort]').forEach((th) => {
      const on = th.dataset.sort === state.sort;
      th.setAttribute('aria-sort', on ? (state.dir === 1 ? 'ascending' : 'descending') : 'none');
      th.querySelector('.sort-icon').textContent = on ? (state.dir === 1 ? '▲' : '▼') : '';
      th.querySelector('.sort-btn').classList.toggle('text-ink', on);
    });

    $('range').textContent = list.length ? `${start + 1}–${start + rows.length} of ${list.length}` : '0 of 0';
    const btn = 'grid h-9 min-w-9 place-items-center rounded-control px-2 focus:outline-none focus:ring-2 focus:ring-primary';
    $('pages').innerHTML =
      `<li><button type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''} aria-label="Previous page" class="${btn} text-muted hover:bg-soft disabled:opacity-40 disabled:hover:bg-transparent">‹</button></li>` +
      pageList(state.page, pages).map((n) => n === '…'
        ? `<li aria-hidden="true" class="px-1 text-muted">…</li>`
        : `<li><button type="button" data-page="${n}" ${n === state.page ? 'aria-current="page"' : ''} aria-label="Page ${n}" class="${btn} tabular ${n === state.page ? 'bg-primary font-medium text-white' : 'text-ink hover:bg-soft'}">${n}</button></li>`).join('') +
      `<li><button type="button" data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''} aria-label="Next page" class="${btn} text-muted hover:bg-soft disabled:opacity-40 disabled:hover:bg-transparent">›</button></li>`;
  }

  $('search').addEventListener('input', (e) => { state.query = e.target.value.trim().toLowerCase(); state.page = 1; render(); });
  $('status-filter').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; render(); });
  $('page-size').addEventListener('change', (e) => { state.size = Number(e.target.value); state.page = 1; render(); });
  $('pages').addEventListener('click', (e) => {
    const b = e.target.closest('[data-page]');
    if (!b || b.disabled) return;
    state.page = Number(b.dataset.page);
    render();
    $('customers-title').scrollIntoView({ block: 'nearest' });
  });
  document.querySelector('thead').addEventListener('click', (e) => {
    const th = e.target.closest('.sort-btn') && e.target.closest('th');
    if (!th) return;
    const key = th.dataset.sort;
    state.dir = state.sort === key ? -state.dir : (key === 'name' || key === 'city' ? 1 : -1);
    state.sort = key;
    render();
  });
  $('rows').addEventListener('change', (e) => {
    const id = Number(e.target.dataset.row);
    if (!id) return;
    e.target.checked ? state.selected.add(id) : state.selected.delete(id);
    render();
  });
  $('select-page').addEventListener('change', (e) => {
    $('rows').querySelectorAll('[data-row]').forEach((cb) => {
      const id = Number(cb.dataset.row);
      e.target.checked ? state.selected.add(id) : state.selected.delete(id);
    });
    render();
  });
  $('clear-selection').addEventListener('click', () => { state.selected.clear(); render(); });
  $('clear-filters').addEventListener('click', () => {
    state.query = ''; state.status = ''; state.page = 1;
    $('search').value = ''; $('status-filter').value = '';
    render();
  });

  // Export: selected rows if any, else everything matching the filters.
  $('export').addEventListener('click', () => {
    const list = state.selected.size ? customers.filter((c) => state.selected.has(c.id)) : filtered();
    const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = [['Name', 'Email', 'Location', 'Orders', 'Spent', 'Status', 'Joined'],
      ...list.map((c) => [c.name, c.email, c.city, c.orders, c.spent, c.status, c.joined.toISOString().slice(0, 10)])]
      .map((r) => r.map(cell).join(',')).join('\n');
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'customers.csv',
    });
    a.click();
    URL.revokeObjectURL(a.href);
  });

  render();
</script>
</body>
</html>
