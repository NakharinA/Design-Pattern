<!doctype html>
<!--
  Spike Admin Dashboard — Shop (example page)

  eCommerce shop: product grid with category, price, rating filters, sort and search.

  Part of a set of example pages that share one shell. Read the conventions:
  - shared.js holds the theme tokens (light from design.md, dark PROPOSED),
    tailwind.config, the light/dark toggle, the mobile drawer and the cart.
  - Use token class names only (bg-surface, text-muted, border-line, bg-primary…),
    never stock Tailwind colors, so the page follows light/dark automatically.
  - Components from element/*.md are marked `Component: <Name> · element/<file>.md`
    and `data-component="<Name>"`. Pieces with no spec file are marked
    `Component: <Name> (no spec)`.
  - All names, products and numbers are sample data. No external images.
  - [data-profile="<field>"] elements show the current user (see shared.js).
    Text inside them is only the default before the script runs.
  - Styling: Tailwind CSS via the Play CDN — needs internet to load styles.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spike Admin — Shop</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="shared.js"></script>
  <script src="ecommerce.js"></script>
</head>
<body class="bg-page font-sans text-sm text-ink antialiased">

<div class="flex min-h-screen">

  <!-- Component: AppSidebar · element/design-sidebar.md -->
  <aside id="sidebar" data-component="AppSidebar"
         class="fixed inset-y-0 left-0 z-40 flex w-[260px] -translate-x-full flex-col border-r border-line bg-surface transition-transform lg:sticky lg:top-0 lg:h-screen lg:translate-x-0">
    <div class="flex h-16 items-center gap-2 px-6">
      <span class="grid h-8 w-8 place-items-center rounded-control bg-primary text-sm font-bold text-white">S</span>
      <span class="text-lg font-semibold">Spike</span>
    </div>
    <nav aria-label="Main navigation" class="flex-1 overflow-y-auto px-4 pb-6">
      <p class="px-3 pb-2 pt-4 text-xs font-semibold uppercase tracking-wide text-muted">Home</p>
      <a href="index.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>
        Dashboard
      </a>
      <p class="px-3 pb-2 pt-6 text-xs font-semibold uppercase tracking-wide text-muted">eCommerce</p>
      <a href="ecommerce-shop.html" aria-current="page" class="flex h-11 items-center gap-3 rounded-control bg-primary px-3 font-medium text-white">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8L6 3H3M9 20a1 1 0 100-2 1 1 0 000 2zm9 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
        Shop
      </a>
      <a href="ecommerce-detail.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        Product Detail
      </a>
      <a href="ecommerce-checkout.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Checkout
      </a>
      <a href="customers.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M3 12h18M3 19h18M8 5v14"/></svg>
        Customers
      </a>
      <p class="px-3 pb-2 pt-6 text-xs font-semibold uppercase tracking-wide text-muted">Apps</p>
      <a href="contacts.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0M17 11a3 3 0 100-6M22 21a6 6 0 00-4-5.6"/></svg>
        Contacts
      </a>
      <p class="px-3 pb-2 pt-6 text-xs font-semibold uppercase tracking-wide text-muted">Pages</p>
      <a href="profile.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
        User Profile
      </a>
      <a href="profile-edit.html" class="flex h-11 items-center gap-3 rounded-control px-3 text-muted hover:bg-primary-light hover:text-primary">
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
        Edit Profile
      </a>
    </nav>
    <a href="profile.html" class="m-4 flex items-center gap-3 rounded-card bg-soft p-3 hover:bg-primary-light">
      <span data-profile="avatar" class="grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-full bg-primary text-xs font-semibold text-white">JD</span>
      <span class="min-w-0">
        <span data-profile="name" class="block truncate font-medium">Jonathan Deo</span>
        <span data-profile="title" class="block truncate text-xs text-muted">Store Admin</span>
      </span>
    </a>
  </aside>
  <div id="sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-black/50 lg:hidden"></div>

  <div class="flex min-w-0 flex-1 flex-col">

    <!-- Component: AppTopbar · element/design-topbar.md -->
    <header data-component="AppTopbar" class="sticky top-0 z-20 flex h-16 items-center justify-between gap-3 border-b border-line bg-surface px-4 md:px-6">
      <div class="flex items-center gap-3">
        <!-- Component: IconButton · element/design-icon-button.md -->
        <button type="button" data-drawer-toggle aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false" data-component="IconButton"
                class="grid h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus:ring-2 focus:ring-primary lg:hidden">
          <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-lg font-semibold">Shop</h1>
      </div>
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Component: ThemeToggle (no spec) — flips light/dark, see shared.js -->
        <button type="button" data-theme-toggle aria-label="Switch theme"
                class="grid h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus:ring-2 focus:ring-primary">
          <svg aria-hidden="true" class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>
          <svg aria-hidden="true" class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="ecommerce-checkout.html" data-cart-link aria-label="Cart"
           class="relative grid h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus:ring-2 focus:ring-primary">
          <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8L6 3H3M9 20a1 1 0 100-2 1 1 0 000 2zm9 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
          <span data-cart-count class="absolute -right-0.5 -top-0.5 hidden min-w-[18px] rounded-full bg-primary px-1 text-center text-[11px] font-semibold leading-[18px] text-white"></span>
        </a>
        <button type="button" aria-label="Open notifications (2 unread)" data-component="IconButton"
                class="relative hidden h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus:ring-2 focus:ring-primary sm:grid">
          <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-primary"></span>
        </button>
        <a href="profile.html" aria-label="Open profile" data-profile="avatar" class="ml-1 grid h-9 w-9 place-items-center overflow-hidden rounded-full bg-primary text-xs font-semibold text-white focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">JD</a>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-6">
      <div class="grid grid-cols-1 gap-5 lg:grid-cols-[240px_1fr] xl:gap-6">

        <!-- Component: ShopFilters (no spec) — on mobile it collapses into a <details> -->
        <aside aria-label="Product filters" data-component="ShopFilters">
          <details id="filters" class="group rounded-card border border-line bg-surface shadow-card lg:pointer-events-none" open>
            <summary class="flex cursor-pointer list-none items-center justify-between p-5 font-semibold lg:cursor-default">
              Filters
              <svg aria-hidden="true" class="h-4 w-4 transition-transform group-open:rotate-180 lg:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </summary>
            <form id="filter-form" class="pointer-events-auto space-y-6 border-t border-line p-5">
              <fieldset>
                <legend class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Category</legend>
                <div id="category-options" class="space-y-1"></div>
              </fieldset>
              <fieldset>
                <legend class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Price</legend>
                <div class="space-y-1">
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="price" value="all" checked class="h-4 w-4 accent-[rgb(var(--c-primary))]" />All</label>
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="price" value="0-100" class="h-4 w-4 accent-[rgb(var(--c-primary))]" />Under $100</label>
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="price" value="100-500" class="h-4 w-4 accent-[rgb(var(--c-primary))]" />$100 – $500</label>
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="price" value="500-99999" class="h-4 w-4 accent-[rgb(var(--c-primary))]" />Over $500</label>
                </div>
              </fieldset>
              <fieldset>
                <legend class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">Rating</legend>
                <div class="space-y-1">
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="rating" value="0" checked class="h-4 w-4 accent-[rgb(var(--c-primary))]" />Any</label>
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="rating" value="4" class="h-4 w-4 accent-[rgb(var(--c-primary))]" /><span class="text-warning" aria-hidden="true">★★★★</span> &amp; up</label>
                  <label class="flex h-9 items-center gap-2"><input type="radio" name="rating" value="5" class="h-4 w-4 accent-[rgb(var(--c-primary))]" /><span class="text-warning" aria-hidden="true">★★★★★</span> only</label>
                </div>
              </fieldset>
              <label class="flex h-9 items-center gap-2"><input type="checkbox" name="inStock" class="h-4 w-4 rounded accent-[rgb(var(--c-primary))]" />In stock only</label>
              <button type="reset" class="inline-flex h-10 w-full items-center justify-center rounded-control border border-primary px-4 font-medium text-primary hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-primary">Reset filters</button>
            </form>
          </details>
        </aside>

        <section aria-labelledby="results-title">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 id="results-title" class="text-base font-semibold"><span id="result-count" class="tabular">0</span> products</h2>
            <div class="flex w-full gap-2 sm:w-auto">
              <!-- Component: SearchField · element/design-search-field.md -->
              <label data-component="SearchField" class="relative block flex-1 sm:w-60 sm:flex-none">
                <span class="sr-only">Search products</span>
                <svg aria-hidden="true" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="product-search" type="search" placeholder="Search products…" class="h-10 w-full rounded-control border border-line bg-surface pl-9 pr-3 placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30" />
              </label>
              <!-- Component: Select · element/design-select.md -->
              <label class="sr-only" for="sort">Sort by</label>
              <select id="sort" data-component="Select" class="h-10 rounded-control border border-line bg-surface px-3 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating">Top rated</option>
              </select>
            </div>
          </div>

          <ul id="product-grid" class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"></ul>

          <!-- Component: EmptyState · element/design-empty-state.md -->
          <div id="product-empty" hidden data-component="EmptyState" class="mt-5 grid min-h-48 place-items-center rounded-card border border-line bg-surface p-6 text-center shadow-card">
            <div>
              <p class="text-base font-medium">No products match</p>
              <p class="mt-1 text-muted">Try another category or clear the filters.</p>
            </div>
          </div>

          <p id="cart-toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-control bg-ink px-4 py-2 text-surface opacity-0 shadow-card transition-opacity"></p>
        </section>
      </div>
    </main>
  </div>
</div>

<script>
  const form = document.getElementById('filter-form');
  const categories = ['All', ...new Set(products.map((p) => p.category))];
  document.getElementById('category-options').innerHTML = categories.map((c, i) => `
    <label class="flex h-9 items-center justify-between gap-2">
      <span class="flex items-center gap-2"><input type="radio" name="category" value="${c}" ${i === 0 ? 'checked' : ''} class="h-4 w-4 accent-[rgb(var(--c-primary))]" />${c}</span>
      <span class="tabular text-xs text-muted">${c === 'All' ? products.length : products.filter((p) => p.category === c).length}</span>
    </label>`).join('');

  // Collapse filters by default on small screens.
  if (matchMedia('(max-width: 1023px)').matches) document.getElementById('filters').open = false;

  function render() {
    const f = Object.fromEntries(new FormData(form));
    const q = document.getElementById('product-search').value.trim().toLowerCase();
    const [min, max] = f.price === 'all' ? [0, Infinity] : f.price.split('-').map(Number);
    let list = products.filter((p) =>
      (f.category === 'All' || p.category === f.category) &&
      p.price >= min && p.price <= max &&
      p.rating >= Number(f.rating) &&
      (!f.inStock || p.stock > 0) &&
      p.name.toLowerCase().includes(q));
    const sort = document.getElementById('sort').value;
    if (sort === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    if (sort === 'rating') list = [...list].sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);

    document.getElementById('result-count').textContent = list.length;
    document.getElementById('product-empty').hidden = list.length > 0;
    // Component: ProductCard (no spec)
    document.getElementById('product-grid').innerHTML = list.map((p) => `
      <li data-component="ProductCard" class="group relative flex flex-col overflow-hidden rounded-card border border-line bg-surface shadow-card">
        ${productImage(p, 'aspect-[4/3]')}
        ${p.oldPrice ? `<span class="absolute left-3 top-3 rounded-full bg-danger px-2 py-0.5 text-xs font-semibold text-white">−${Math.round((1 - p.price / p.oldPrice) * 100)}%</span>` : ''}
        <div class="flex flex-1 flex-col p-4">
          <p class="text-xs text-muted">${p.category}</p>
          <h3 class="mt-1 font-semibold"><a href="ecommerce-detail.html?id=${p.id}" class="after:absolute after:inset-0 hover:text-primary focus:outline-none">${p.name}</a></h3>
          <div class="mt-1 flex items-center gap-2 text-xs">${stars(p.rating)}<span class="text-muted">(${p.reviews})</span></div>
          <div class="mt-auto flex items-end justify-between pt-4">
            <p><span class="tabular text-lg font-semibold">${money(p.price)}</span>
              ${p.oldPrice ? `<span class="tabular ml-1 text-muted line-through">${money(p.oldPrice)}</span>` : ''}</p>
            ${p.stock > 0
              ? `<button type="button" data-add="${p.id}" aria-label="Add ${p.name} to cart" class="relative z-10 grid h-10 w-10 place-items-center rounded-control bg-primary text-white hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                   <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-2 9H8L6 3H3M9 20a1 1 0 100-2 1 1 0 000 2zm9 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
                 </button>`
              : `<span class="inline-flex rounded-full bg-soft px-2.5 py-1 text-xs font-medium text-muted">Out of stock</span>`}
          </div>
        </div>
      </li>`).join('');
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('cart-toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('opacity-0'), 1800);
  }

  document.getElementById('product-grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-add]');
    if (!b) return;
    const p = findProduct(b.dataset.add);
    cart.add(p.id, 1, p.colors[0]);
    toast(`${p.name} added to cart`);
  });
  form.addEventListener('change', render);
  form.addEventListener('reset', () => setTimeout(render));
  document.getElementById('product-search').addEventListener('input', render);
  document.getElementById('sort').addEventListener('change', render);
  render();
</script>
</body>
</html>
