<!doctype html>
<!--
  Spike Admin Dashboard — Login (example page)

  Layout copied from the real Spike auth page:
  https://spike-nuxtjs-pro-main.netlify.app/auth/login
  - Pale page, two decorative blobs (coral circle bottom-left, sky-blue blob
    top-right) behind one big white card.
  - Card: logo top-left; illustration on the left half (hidden below md);
    form on the right: big welcome title, two social buttons, "or sign in
    with" divider, Username + Password, remember / forgot row, pill-shaped
    primary button, "Create An Account" link.
  - The original uses a licensed 3D illustration and Google/Facebook logos.
    They are NOT copied: the illustration is an original inline SVG in the
    same theme (safe, shields, piggy bank) and the social buttons use generic
    icons.
  - Colors use the shared tokens (shared.js), so light/dark works. The live
    site's own primary is #0085DB — see the Spike README note.

  Behaviour (demo only, nothing is sent anywhere):
  - Validation, show/hide password, wrong-password alert, loading state.
  - Demo account: the saved profile's email + "Demo1234". An account made on
    register.html signs in with any 8+ character password.
  - "Forgot Password ?" swaps the form for a reset form on the same card.

  Styling: Tailwind CSS via the Play CDN — needs internet to load styles.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spike Admin — Sign in</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-page font-sans text-sm text-ink antialiased">

<!-- Component: AuthLayout (no spec) — blobs + centered card -->
<div class="relative flex min-h-screen items-center overflow-hidden px-3 py-10 sm:px-8 lg:px-16">

  <!-- Decorative blobs (behind the card) -->
  <div aria-hidden="true" class="pointer-events-none absolute -bottom-24 -left-24 h-[420px] w-[420px] rounded-full bg-danger opacity-90 dark:opacity-60 sm:-bottom-10 sm:-left-6"></div>
  <div aria-hidden="true" class="pointer-events-none absolute -right-10 -top-6 h-[300px] w-[300px] sm:right-14 sm:top-6">
    <div class="absolute inset-0 translate-x-[-10px] translate-y-[10px] rounded-[45%_55%_40%_60%/55%_40%_60%_45%] bg-secondary opacity-40"></div>
    <div class="absolute inset-0 rounded-[45%_55%_40%_60%/55%_40%_60%_45%] bg-secondary opacity-90 dark:opacity-60"></div>
  </div>

  <!-- Component: AuthCard (no spec) -->
  <div class="relative z-10 mx-auto w-full max-w-[1180px] rounded-2xl border border-line bg-surface shadow-[0_20px_60px_rgb(20_35_60/8%)]">
    <div class="px-5 py-6 sm:px-11 sm:py-8">

      <header class="flex items-center justify-between">
        <!-- Logo: original rocket mark (not the Spike logo file) -->
        <a href="index.html" class="flex items-center gap-2.5 text-xl font-semibold text-ink">
          <svg aria-hidden="true" class="h-9 w-9" viewBox="0 0 40 40">
            <path d="M30 6c-7 0-13 4-16 10l-5 1-3 5 7 1 3 3 1 7 5-3 1-5c6-3 10-9 10-16V6h-3z" class="fill-primary"/>
            <circle cx="24.5" cy="15.5" r="3" class="fill-surface"/>
            <path d="M9 25c-3 1-4 4-4 8 4 0 7-1 8-4z" class="fill-secondary"/>
          </svg>
          Spike Admin
        </a>
        <!-- Component: ThemeToggle (no spec) — flips light/dark, see shared.js -->
        <button type="button" data-theme-toggle aria-label="Switch theme"
                class="grid h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
          <svg aria-hidden="true" class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>
          <svg aria-hidden="true" class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <div class="grid items-center gap-10 py-6 md:grid-cols-2 md:py-10 lg:gap-16">

        <!-- Component: AuthIllustration (no spec) — original SVG; decorative, hidden below md -->
        <div class="hidden justify-center md:flex" aria-hidden="true">
          <svg class="w-full max-w-[420px]" viewBox="0 0 420 380" fill="none">
            <!-- ground -->
            <path d="M20 352h380" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <path d="M48 352c4-14 10-20 14-22M62 352c0-12 4-18 10-22M36 352c2-8 6-12 10-14" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <path d="M340 352c4-14 10-20 14-22M354 352c0-12 4-18 10-22M328 352c2-8 6-12 10-14" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <!-- safe -->
            <rect x="130" y="196" width="170" height="150" rx="14" class="fill-warning"/>
            <rect x="146" y="212" width="138" height="118" rx="10" class="fill-warning-light"/>
            <circle cx="215" cy="271" r="30" class="fill-warning stroke-warning-dark" stroke-width="4"/>
            <circle cx="215" cy="271" r="8" class="fill-warning-dark"/>
            <path d="M215 241v10M215 291v10M185 271h10M235 271h10" class="stroke-warning-dark" stroke-width="4" stroke-linecap="round"/>
            <rect x="150" y="342" width="22" height="10" rx="3" class="fill-warning-dark"/>
            <rect x="258" y="342" width="22" height="10" rx="3" class="fill-warning-dark"/>
            <!-- piggy bank on the safe -->
            <ellipse cx="214" cy="164" rx="46" ry="34" class="fill-danger-light stroke-danger" stroke-width="3"/>
            <circle cx="250" cy="156" r="14" class="fill-danger-light stroke-danger" stroke-width="3"/>
            <path d="M190 134l-8-16 18 8" class="fill-danger-light stroke-danger" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="236" cy="150" r="3" class="fill-ink"/>
            <rect x="200" y="128" width="26" height="5" rx="2.5" class="fill-danger"/>
            <path d="M188 194v8M236 194v8" class="stroke-danger" stroke-width="6" stroke-linecap="round"/>
            <!-- coins -->
            <ellipse cx="214" cy="106" rx="12" ry="12" class="fill-warning stroke-warning-dark" stroke-width="3"/>
            <ellipse cx="160" cy="188" rx="10" ry="6" class="fill-warning stroke-warning-dark" stroke-width="2"/>
            <ellipse cx="160" cy="180" rx="10" ry="6" class="fill-warning stroke-warning-dark" stroke-width="2"/>
            <!-- left shield -->
            <path d="M58 120l52-20 52 20v54c0 40-26 66-52 80-26-14-52-40-52-80z" class="fill-primary-light stroke-primary" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="110" cy="174" r="22" class="fill-primary"/>
            <path d="M100 174l7 7 14-15" class="stroke-surface" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- right shield -->
            <path d="M290 160l44-16 44 16v44c0 34-22 56-44 68-22-12-44-34-44-68z" class="fill-primary-light stroke-primary" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="334" cy="204" r="18" class="fill-primary"/>
            <path d="M326 204l6 6 11-12" class="stroke-surface" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- Form column -->
        <div class="mx-auto w-full max-w-[460px]">

          <!-- ===== View: Sign in ===== -->
          <section id="view-login" aria-labelledby="login-title">
            <h1 id="login-title" class="text-[28px] font-bold leading-tight text-ink sm:text-[32px]">Welcome to Spike Admin</h1>
            <p class="mt-3 text-base font-medium text-ink">Your Admin Dashboard</p>

            <!-- Social sign-in (generic icons; no third-party logos) -->
            <div class="mt-8 grid grid-cols-2 gap-6">
              <button type="button" data-notice="Google sign-in isn’t set up in this demo." class="inline-flex h-11 items-center justify-center gap-2 rounded-control border border-line bg-surface px-3 font-semibold text-ink hover:border-primary hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg aria-hidden="true" class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
                <span class="hidden sm:inline">Sign In With</span>Google
              </button>
              <button type="button" data-notice="Facebook sign-in isn’t set up in this demo." class="inline-flex h-11 items-center justify-center gap-2 rounded-control border border-line bg-surface px-3 font-semibold text-ink hover:border-primary hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg aria-hidden="true" class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0M17 11a3 3 0 100-6M22 21a6 6 0 00-4-5.6"/></svg>
                <span class="hidden sm:inline">Sign In With</span>FB
              </button>
            </div>

            <div class="my-8 flex items-center gap-5 text-muted" aria-hidden="true"><span class="h-px flex-1 bg-line"></span>or sign in with<span class="h-px flex-1 bg-line"></span></div>

            <!-- Component: ErrorState · element/design-error-state.md (inline, shown on bad credentials) -->
            <div id="login-alert" data-component="ErrorState" role="alert" hidden class="mb-6 flex items-start gap-3 rounded-control border border-danger/40 bg-danger-light p-3 text-danger-dark">
              <svg aria-hidden="true" class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
              <p id="login-alert-text" class="flex-1"></p>
            </div>

            <form id="login-form" class="space-y-6" novalidate>
              <!-- Component: TextInput · element/design-input.md -->
              <div data-component="TextInput">
                <label for="l-email" class="mb-2 block font-semibold text-ink">Username</label>
                <input id="l-email" type="email" autocomplete="username" placeholder="name@example.com" aria-describedby="l-email-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                <p id="l-email-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
              </div>
              <div>
                <label for="l-password" class="mb-2 block font-semibold text-ink">Password</label>
                <div class="relative">
                  <input id="l-password" type="password" autocomplete="current-password" aria-describedby="l-password-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 pr-16 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                  <button type="button" data-toggle-pw="l-password" aria-pressed="false" class="absolute right-2 top-1/2 h-8 -translate-y-1/2 rounded px-2 text-xs font-medium text-primary hover:bg-primary-light focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Show</button>
                </div>
                <p id="l-password-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="flex items-center gap-2.5 text-ink">
                  <input id="l-remember" type="checkbox" class="h-[18px] w-[18px] rounded accent-primary" /> Remember this Device
                </label>
                <button type="button" id="to-forgot" class="font-medium text-primary hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Forgot Password ?</button>
              </div>

              <!-- Component: Button · element/design-button.md (primary, pill, full width, loading) -->
              <button id="login-submit" type="submit" data-component="Button" class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-full bg-primary px-4 text-base font-medium text-white hover:bg-primary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface disabled:opacity-70">Sign In</button>
            </form>

            <p class="mt-6 text-muted">New to Spike? <a href="register.html" class="ml-1 font-medium text-primary hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Create An Account</a></p>

            <!-- Demo hint (not in the original) -->
            <p class="mt-6 rounded-control bg-info-light p-3 text-xs text-info-dark">
              Demo account: <button type="button" id="fill-demo" class="font-semibold underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"><span id="demo-email"></span> / Demo1234</button>
            </p>
          </section>

          <!-- ===== View: Forgot password ===== -->
          <section id="view-forgot" aria-labelledby="forgot-title" hidden>
            <button type="button" id="back-to-login" class="mb-6 inline-flex items-center gap-1 font-medium text-primary hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
              <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg> Back to sign in
            </button>
            <div id="forgot-form-wrap">
              <h1 id="forgot-title" class="text-[28px] font-bold leading-tight text-ink sm:text-[32px]">Forgot your password?</h1>
              <p class="mt-3 text-base font-medium text-ink">Enter your account email and we’ll send a reset link.</p>
              <form id="forgot-form" class="mt-8 space-y-6" novalidate>
                <div>
                  <label for="f-email" class="mb-2 block font-semibold text-ink">Email Address</label>
                  <input id="f-email" type="email" autocomplete="email" aria-describedby="f-email-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                  <p id="f-email-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
                </div>
                <button id="forgot-submit" type="submit" class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-full bg-primary px-4 text-base font-medium text-white hover:bg-primary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface disabled:opacity-70">Send Reset Link</button>
              </form>
            </div>
            <!-- Success state -->
            <div id="forgot-done" hidden role="status">
              <span class="grid h-14 w-14 place-items-center rounded-full bg-success-light text-success-dark" aria-hidden="true">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              </span>
              <h2 class="mt-5 text-2xl font-bold text-ink">Check your inbox</h2>
              <p class="mt-2 text-muted">If <b id="forgot-sent-to" class="font-medium text-ink"></b> has an account, a reset link is on its way. It expires in 30 minutes.</p>
              <button type="button" id="forgot-resend" class="mt-5 font-medium text-primary hover:underline disabled:text-muted disabled:no-underline">Resend email</button>
            </div>
          </section>

          <!-- Notice line for buttons/links outside this demo -->
          <p id="notice" role="status" aria-live="polite" class="mt-4 text-xs text-info-dark empty:hidden"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (sel) => document.querySelector(sel);
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const DEMO_PASSWORD = 'Demo1234';
  const spinner = '<svg aria-hidden="true" class="h-4 w-4 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

  const account = window.profile.get();            // saved profile = the one known account (shared.js)
  const registered = (() => { try { return localStorage.getItem('spike-registered') === account.email; } catch { return false; } })();
  $('#demo-email').textContent = account.email;

  function setError(id, msg) {
    const input = $(`#${id}`);
    msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
    $(`#${id}-error`).textContent = msg;
    return !msg;
  }
  const busy = (btn, on, label) => { btn.disabled = on; btn.innerHTML = on ? `${spinner}${label}` : label; };

  // Show / hide password
  document.querySelectorAll('[data-toggle-pw]').forEach((b) => b.addEventListener('click', () => {
    const input = $(`#${b.dataset.togglePw}`), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.textContent = show ? 'Hide' : 'Show';
    b.setAttribute('aria-pressed', String(show));
  }));
  ['l-email', 'l-password', 'f-email'].forEach((id) => $(`#${id}`).addEventListener('input', () => { setError(id, ''); $('#login-alert').hidden = true; }));

  $('#fill-demo').addEventListener('click', () => {
    $('#l-email').value = account.email;
    $('#l-password').value = DEMO_PASSWORD;
    $('#login-submit').focus();
  });

  // ---------- Sign in ----------
  $('#login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    $('#login-alert').hidden = true;
    const email = $('#l-email').value.trim().toLowerCase(), pw = $('#l-password').value;
    const ok = [
      setError('l-email', !email ? 'Enter your email.' : !EMAIL.test(email) ? 'Enter a valid email, like name@example.com.' : ''),
      setError('l-password', pw ? '' : 'Enter your password.'),
    ].every(Boolean);
    if (!ok) return document.querySelector('#login-form [aria-invalid="true"]').focus();

    const btn = $('#login-submit');
    busy(btn, true, 'Signing in…');
    setTimeout(() => {
      const known = email === account.email.toLowerCase();
      const pwOk = known && (pw === DEMO_PASSWORD || (registered && pw.length >= 8));
      if (!pwOk) {
        busy(btn, false, 'Sign In');
        // Same message for unknown email and wrong password, so the form doesn't reveal which accounts exist.
        $('#login-alert-text').textContent = 'That email and password don’t match. Check them and try again.';
        $('#login-alert').hidden = false;
        $('#l-password').value = '';
        $('#l-password').focus();
        return;
      }
      busy(btn, true, 'Signed in — opening dashboard…');
      setTimeout(() => (location.href = 'index.html'), 500);
    }, 800);
  });

  // ---------- Forgot password view ----------
  const show = (view) => {
    $('#view-login').hidden = view !== 'login';
    $('#view-forgot').hidden = view !== 'forgot';
    document.title = view === 'login' ? 'Spike Admin — Sign in' : 'Spike Admin — Reset password';
    history.replaceState(null, '', view === 'forgot' ? '#forgot' : location.pathname);
  };
  $('#to-forgot').addEventListener('click', () => {
    show('forgot');
    $('#forgot-form-wrap').hidden = false; $('#forgot-done').hidden = true;
    $('#f-email').value = $('#l-email').value;
    $('#f-email').focus();
  });
  $('#back-to-login').addEventListener('click', () => { show('login'); $('#l-email').focus(); });

  $('#forgot-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = $('#f-email').value.trim();
    if (!setError('f-email', !email ? 'Enter your email.' : !EMAIL.test(email) ? 'Enter a valid email, like name@example.com.' : '')) return $('#f-email').focus();
    const btn = $('#forgot-submit');
    busy(btn, true, 'Sending…');
    setTimeout(() => {
      busy(btn, false, 'Send Reset Link');
      $('#forgot-sent-to').textContent = email;
      $('#forgot-form-wrap').hidden = true;
      $('#forgot-done').hidden = false;
    }, 700);
  });
  $('#forgot-resend').addEventListener('click', (e) => {
    const b = e.currentTarget;
    b.disabled = true;
    $('#notice').textContent = 'Reset link sent again.';
    let s = 30;
    const tick = setInterval(() => {
      b.textContent = `Resend in ${--s}s`;
      if (s <= 0) { clearInterval(tick); b.disabled = false; b.textContent = 'Resend email'; }
    }, 1000);
  });

  if (location.hash === '#forgot') $('#to-forgot').click();

  // Buttons outside this demo explain themselves in the notice line.
  document.addEventListener('click', (e) => {
    const n = e.target.closest('[data-notice]');
    if (!n) return;
    e.preventDefault();
    $('#notice').textContent = n.dataset.notice;
  });
</script>
</body>
</html>
