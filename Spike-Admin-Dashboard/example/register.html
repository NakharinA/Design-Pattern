<!doctype html>
<!--
  Spike Admin Dashboard — Register (example page)

  Layout copied from the real Spike auth page:
  https://spike-nuxtjs-pro-main.netlify.app/auth/register
  Same shell as login.html (blobs, big card, logo, illustration left, form
  right). The form follows the original: Name, Email Address, Password, a
  pill "Sign Up" button and "Already have an Account? Sign In".
  - Not copied: the 3D illustration and the Google/Facebook logos (original
    SVG + generic icons instead).
  - Added on top of the original: password strength checklist, inline errors,
    loading and success states, a terms line.

  Behaviour (demo only): the password is never stored. Signing up saves the
  name and email as the current profile (shared.js), so the sidebar on every
  page shows them; login.html then accepts any 8+ character password for
  that email.

  Styling: Tailwind CSS via the Play CDN — needs internet to load styles.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spike Admin — Sign up</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-page font-sans text-sm text-ink antialiased">

<!-- Component: AuthLayout (no spec) — blobs + centered card -->
<div class="relative flex min-h-screen items-center overflow-hidden px-3 py-10 sm:px-8 lg:px-16">

  <!-- Decorative blobs (behind the card) -->
  <div aria-hidden="true" class="pointer-events-none absolute -bottom-24 -left-24 h-[420px] w-[420px] rounded-full bg-danger opacity-90 dark:opacity-60 sm:-bottom-10 sm:-left-6"></div>
  <div aria-hidden="true" class="pointer-events-none absolute -right-10 -top-6 h-[300px] w-[300px] sm:right-14 sm:top-6">
    <div class="absolute inset-0 translate-x-[-10px] translate-y-[10px] rounded-[45%_55%_40%_60%/55%_40%_60%_45%] bg-secondary opacity-40"></div>
    <div class="absolute inset-0 rounded-[45%_55%_40%_60%/55%_40%_60%_45%] bg-secondary opacity-90 dark:opacity-60"></div>
  </div>

  <!-- Component: AuthCard (no spec) -->
  <div class="relative z-10 mx-auto w-full max-w-[1180px] rounded-2xl border border-line bg-surface shadow-[0_20px_60px_rgb(20_35_60/8%)]">
    <div class="px-5 py-6 sm:px-11 sm:py-8">

      <header class="flex items-center justify-between">
        <!-- Logo: original rocket mark (not the Spike logo file) -->
        <a href="index.html" class="flex items-center gap-2.5 text-xl font-semibold text-ink">
          <svg aria-hidden="true" class="h-9 w-9" viewBox="0 0 40 40">
            <path d="M30 6c-7 0-13 4-16 10l-5 1-3 5 7 1 3 3 1 7 5-3 1-5c6-3 10-9 10-16V6h-3z" class="fill-primary"/>
            <circle cx="24.5" cy="15.5" r="3" class="fill-surface"/>
            <path d="M9 25c-3 1-4 4-4 8 4 0 7-1 8-4z" class="fill-secondary"/>
          </svg>
          Spike Admin
        </a>
        <!-- Component: ThemeToggle (no spec) — flips light/dark, see shared.js -->
        <button type="button" data-theme-toggle aria-label="Switch theme"
                class="grid h-10 w-10 place-items-center rounded-control text-muted hover:bg-soft focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
          <svg aria-hidden="true" class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>
          <svg aria-hidden="true" class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <div class="grid items-center gap-10 py-6 md:grid-cols-2 md:py-10 lg:gap-16">

        <!-- Component: AuthIllustration (no spec) — original SVG; decorative, hidden below md -->
        <div class="hidden justify-center md:flex" aria-hidden="true">
          <svg class="w-full max-w-[420px]" viewBox="0 0 420 380" fill="none">
            <!-- ground -->
            <path d="M20 352h380" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <path d="M48 352c4-14 10-20 14-22M62 352c0-12 4-18 10-22M36 352c2-8 6-12 10-14" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <path d="M340 352c4-14 10-20 14-22M354 352c0-12 4-18 10-22M328 352c2-8 6-12 10-14" class="stroke-success" stroke-width="3" stroke-linecap="round"/>
            <!-- safe -->
            <rect x="130" y="196" width="170" height="150" rx="14" class="fill-warning"/>
            <rect x="146" y="212" width="138" height="118" rx="10" class="fill-warning-light"/>
            <circle cx="215" cy="271" r="30" class="fill-warning stroke-warning-dark" stroke-width="4"/>
            <circle cx="215" cy="271" r="8" class="fill-warning-dark"/>
            <path d="M215 241v10M215 291v10M185 271h10M235 271h10" class="stroke-warning-dark" stroke-width="4" stroke-linecap="round"/>
            <rect x="150" y="342" width="22" height="10" rx="3" class="fill-warning-dark"/>
            <rect x="258" y="342" width="22" height="10" rx="3" class="fill-warning-dark"/>
            <!-- piggy bank on the safe -->
            <ellipse cx="214" cy="164" rx="46" ry="34" class="fill-danger-light stroke-danger" stroke-width="3"/>
            <circle cx="250" cy="156" r="14" class="fill-danger-light stroke-danger" stroke-width="3"/>
            <path d="M190 134l-8-16 18 8" class="fill-danger-light stroke-danger" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="236" cy="150" r="3" class="fill-ink"/>
            <rect x="200" y="128" width="26" height="5" rx="2.5" class="fill-danger"/>
            <path d="M188 194v8M236 194v8" class="stroke-danger" stroke-width="6" stroke-linecap="round"/>
            <!-- coins -->
            <ellipse cx="214" cy="106" rx="12" ry="12" class="fill-warning stroke-warning-dark" stroke-width="3"/>
            <ellipse cx="160" cy="188" rx="10" ry="6" class="fill-warning stroke-warning-dark" stroke-width="2"/>
            <ellipse cx="160" cy="180" rx="10" ry="6" class="fill-warning stroke-warning-dark" stroke-width="2"/>
            <!-- left shield -->
            <path d="M58 120l52-20 52 20v54c0 40-26 66-52 80-26-14-52-40-52-80z" class="fill-primary-light stroke-primary" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="110" cy="174" r="22" class="fill-primary"/>
            <path d="M100 174l7 7 14-15" class="stroke-surface" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- right shield -->
            <path d="M290 160l44-16 44 16v44c0 34-22 56-44 68-22-12-44-34-44-68z" class="fill-primary-light stroke-primary" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="334" cy="204" r="18" class="fill-primary"/>
            <path d="M326 204l6 6 11-12" class="stroke-surface" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- Form column -->
        <div class="mx-auto w-full max-w-[460px]">

          <!-- ===== View: Sign up ===== -->
          <section id="view-register" aria-labelledby="register-title">
            <h1 id="register-title" class="text-[28px] font-bold leading-tight text-ink sm:text-[32px]">Welcome to Spike Admin</h1>
            <p class="mt-3 text-base font-medium text-ink">Your Admin Dashboard</p>

            <!-- Social sign-up (generic icons; no third-party logos) -->
            <div class="mt-8 grid grid-cols-2 gap-6">
              <button type="button" data-notice="Google sign-up isn’t set up in this demo." class="inline-flex h-11 items-center justify-center gap-2 rounded-control border border-line bg-surface px-3 font-semibold text-ink hover:border-primary hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg aria-hidden="true" class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
                <span class="hidden sm:inline">Sign Up With</span>Google
              </button>
              <button type="button" data-notice="Facebook sign-up isn’t set up in this demo." class="inline-flex h-11 items-center justify-center gap-2 rounded-control border border-line bg-surface px-3 font-semibold text-ink hover:border-primary hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg aria-hidden="true" class="h-4 w-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0M17 11a3 3 0 100-6M22 21a6 6 0 00-4-5.6"/></svg>
                <span class="hidden sm:inline">Sign Up With</span>FB
              </button>
            </div>

            <div class="my-8 flex items-center gap-5 text-muted" aria-hidden="true"><span class="h-px flex-1 bg-line"></span>or sign up with<span class="h-px flex-1 bg-line"></span></div>

            <form id="register-form" class="space-y-6" novalidate>
              <!-- Component: TextInput · element/design-input.md -->
              <div data-component="TextInput">
                <label for="r-name" class="mb-2 block font-semibold text-ink">Name</label>
                <input id="r-name" type="text" autocomplete="name" placeholder="First and last name" aria-describedby="r-name-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                <p id="r-name-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
              </div>
              <div>
                <label for="r-email" class="mb-2 block font-semibold text-ink">Email Address</label>
                <input id="r-email" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="r-email-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                <p id="r-email-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
              </div>
              <div>
                <label for="r-password" class="mb-2 block font-semibold text-ink">Password</label>
                <div class="relative">
                  <input id="r-password" type="password" autocomplete="new-password" aria-describedby="r-strength r-password-error" class="block h-12 w-full rounded-control border border-line bg-surface px-4 pr-16 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 aria-[invalid=true]:border-danger" />
                  <button type="button" data-toggle-pw="r-password" aria-pressed="false" class="absolute right-2 top-1/2 h-8 -translate-y-1/2 rounded px-2 text-xs font-medium text-primary hover:bg-primary-light focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Show</button>
                </div>
                <!-- Strength meter (not in the original): 4 bars + checklist text -->
                <div id="strength-bars" class="mt-2 grid grid-cols-4 gap-1" aria-hidden="true">
                  <span class="h-1.5 rounded-full bg-soft"></span><span class="h-1.5 rounded-full bg-soft"></span><span class="h-1.5 rounded-full bg-soft"></span><span class="h-1.5 rounded-full bg-soft"></span>
                </div>
                <ul id="r-strength" class="mt-2 grid grid-cols-1 gap-1 text-xs sm:grid-cols-3"></ul>
                <p id="r-password-error" class="mt-1.5 text-xs text-danger-dark empty:hidden"></p>
              </div>

              <!-- Component: Button · element/design-button.md (primary, pill, full width, loading) -->
              <button id="register-submit" type="submit" data-component="Button" class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-full bg-primary px-4 text-base font-medium text-white hover:bg-primary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface disabled:opacity-70">Sign Up</button>
              <p class="text-xs text-muted">By signing up you agree to the <a href="#" data-notice="Terms page isn’t part of this demo." class="font-medium text-primary hover:underline">Terms</a> and <a href="#" data-notice="Privacy page isn’t part of this demo." class="font-medium text-primary hover:underline">Privacy Policy</a>.</p>
            </form>

            <p class="mt-6 text-muted">Already have an Account? <a href="login.html" class="ml-1 font-medium text-primary hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Sign In</a></p>
          </section>

          <!-- ===== Success state ===== -->
          <section id="view-done" hidden role="status" aria-labelledby="done-title">
            <span class="grid h-14 w-14 place-items-center rounded-full bg-success-light text-success-dark" aria-hidden="true">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
            </span>
            <h1 id="done-title" class="mt-5 text-[28px] font-bold leading-tight text-ink">Welcome, <span id="done-name"></span>!</h1>
            <p class="mt-3 text-muted">Your account is ready. We sent a confirmation to <b id="done-email" class="font-medium text-ink"></b>.</p>
            <a href="index.html" class="mt-8 inline-flex h-12 w-full items-center justify-center rounded-full bg-primary px-4 text-base font-medium text-white hover:bg-primary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface">Go to Dashboard</a>
            <a href="profile-edit.html" class="mt-4 inline-block font-medium text-primary hover:underline">Finish your profile</a>
          </section>

          <!-- Notice line for buttons/links outside this demo -->
          <p id="notice" role="status" aria-live="polite" class="mt-4 text-xs text-info-dark empty:hidden"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = (sel) => document.querySelector(sel);
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const spinner = '<svg aria-hidden="true" class="h-4 w-4 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
  const RULES = [
    ['8+ characters', (p) => p.length >= 8],
    ['A number', (p) => /\d/.test(p)],
    ['A capital letter', (p) => /[A-Z]/.test(p)],
  ];

  function setError(id, msg) {
    const input = $(`#${id}`);
    msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
    $(`#${id}-error`).textContent = msg;
    return !msg;
  }

  // Password checklist + strength bars (4th bar = 12+ chars or a symbol, a bonus).
  function renderStrength() {
    const pw = $('#r-password').value;
    const passed = RULES.map(([, test]) => test(pw));
    const score = pw ? passed.filter(Boolean).length + (pw.length >= 12 || /[^\w]/.test(pw) ? 1 : 0) : 0;
    const color = ['bg-soft', 'bg-danger', 'bg-warning', 'bg-primary', 'bg-success'][score];
    document.querySelectorAll('#strength-bars span').forEach((s, i) => (s.className = `h-1.5 rounded-full ${i < score ? color : 'bg-soft'}`));
    $('#r-strength').innerHTML = RULES.map(([label], i) => `
      <li class="flex items-center gap-1.5 ${passed[i] ? 'text-success-dark' : 'text-muted'}">
        <span aria-hidden="true">${passed[i] ? '✓' : '○'}</span>${label}<span class="sr-only">${passed[i] ? ' — met' : ' — not met'}</span></li>`).join('');
  }
  $('#r-password').addEventListener('input', renderStrength);
  renderStrength();

  document.querySelectorAll('[data-toggle-pw]').forEach((b) => b.addEventListener('click', () => {
    const input = $(`#${b.dataset.togglePw}`), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.textContent = show ? 'Hide' : 'Show';
    b.setAttribute('aria-pressed', String(show));
  }));
  ['r-name', 'r-email', 'r-password'].forEach((id) => $(`#${id}`).addEventListener('input', () => setError(id, '')));

  $('#register-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#r-name').value.trim().replace(/\s+/g, ' ');
    const email = $('#r-email').value.trim().toLowerCase();
    const pw = $('#r-password').value;
    const ok = [
      setError('r-name', name ? '' : 'Enter your name.'),
      setError('r-email', !email ? 'Enter your email.' : !EMAIL.test(email) ? 'Enter a valid email, like name@example.com.' : ''),
      setError('r-password', RULES.every(([, t]) => t(pw)) ? '' : 'Use 8+ characters with a number and a capital letter.'),
    ].every(Boolean);
    if (!ok) return document.querySelector('#register-form [aria-invalid="true"]').focus();

    const btn = $('#register-submit');
    btn.disabled = true;
    btn.innerHTML = `${spinner}Creating account…`;
    setTimeout(() => {
      // One "Name" field, split for the profile: first word = first name, the rest = last name.
      const [firstName, ...rest] = name.split(' ');
      // Only the profile is saved — never the password.
      window.profile.set({ ...window.profile.get(), firstName, lastName: rest.join(' '), email, avatar: '' });
      try { localStorage.setItem('spike-registered', email); } catch { /* storage blocked */ }
      $('#done-name').textContent = firstName;
      $('#done-email').textContent = email;
      $('#view-register').hidden = true;
      $('#view-done').hidden = false;
      $('#view-done a').focus();
    }, 900);
  });

  // Buttons and links outside this demo explain themselves in the notice line.
  document.addEventListener('click', (e) => {
    const n = e.target.closest('[data-notice]');
    if (!n) return;
    e.preventDefault();
    $('#notice').textContent = n.dataset.notice;
  });
</script>
</body>
</html>
